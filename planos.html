<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-lampup.png">
<title>Planos — LampUP IT</title>
<meta name="description" content="Planos do Lumen: do Free ao Enterprise, cobrados por consumo de tokens. A tabela vigente fica na página de planos do Lumen.">
<!--
  01/09/2026 — ESTA PÁGINA DEIXOU DE TER TABELA DE PREÇOS. Redireciona para
  lumen.lampup.com.br/planos, que lê o catálogo vigente (catalog-svc) em
  tempo real.

  POR QUÊ: até 01/09 este arquivo carregava, em HTML estático, os planos
  Starter (R$ 297) / Growth (R$ 897) / Scale (R$ 2.497) cobrados por
  "execuções/mês". Esses três planos entraram em SUNSET no B-110 (02/08) e
  o modelo comercial passou a ser por TOKEN. Como o `catalog-plans.js` casa
  por slug e os slugs sunset não voltam no endpoint público, o fetch nunca
  substituía nada: a página exibia 100% do tempo uma oferta que não existe
  mais, com preços até 5x errados, em URL pública.

  É o mesmo defeito do B-166 (fallback de preço congelado no signup) numa
  página de marketing. A correção segue a mesma regra: preço vencido em
  código é bomba com relógio — o conserto não é atualizar os números aqui,
  é PARAR de guardar preço aqui. Fonte da verdade única = catalog-svc, e
  quem a renderiza é o Lumen.

  NÃO reintroduzir tabela de preços neste arquivo.
-->
<link rel="canonical" href="https://lumen.lampup.com.br/planos">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://lumen.lampup.com.br/planos">
<style>
  :root { --cyan:#00D4E8; --purple:#5B2D9F; --purple-dark:#3D1F6B; --text:#1A1A2E; --gray:#666; }
  * { margin:0; padding:0; box-sizing:border-box; }
  @font-face { font-family:'UniNeue'; src:url('/fonts/UniNeueBook.ttf') format('truetype'); font-weight:400; font-display:swap; }
  @font-face { font-family:'UniNeue'; src:url('/fonts/UniNeueBold.ttf') format('truetype'); font-weight:700; font-display:swap; }
  @font-face { font-family:'UniNeue'; src:url('/fonts/UniNeueBlack.ttf') format('truetype'); font-weight:900; font-display:swap; }
  body {
    font-family:'UniNeue','Segoe UI',Arial,sans-serif; color:var(--text);
    background:linear-gradient(135deg,var(--purple-dark),var(--purple));
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 24px; line-height:1.6;
  }
  .box { background:#fff; border-radius:16px; padding:44px 40px; max-width:520px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .box img { height:44px; margin-bottom:24px; }
  h1 { font-size:26px; font-weight:900; color:var(--purple-dark); margin-bottom:12px; }
  p { color:var(--gray); font-size:15px; margin-bottom:24px; }
  a.cta { display:inline-block; background:var(--purple); color:#fff; text-decoration:none; font-weight:700; padding:14px 28px; border-radius:10px; }
  a.cta:hover { background:var(--purple-dark); }
  small { display:block; margin-top:20px; color:#999; font-size:12px; }
</style>
</head>
<body>
  <div class="box">
    <img src="/logo-lampup.png" alt="LampUP IT">
    <h1>Os planos do Lumen mudaram de endereço</h1>
    <p>
      A tabela vigente — do Free ao Enterprise, cobrada por consumo de tokens —
      fica na página de planos do Lumen, que lê o catálogo em tempo real.
    </p>
    <a class="cta" href="https://lumen.lampup.com.br/planos">Ver os planos do Lumen</a>
    <small>Redirecionando automaticamente…</small>
  </div>
  <script>location.replace("https://lumen.lampup.com.br/planos");</script>
</body>
</html>
